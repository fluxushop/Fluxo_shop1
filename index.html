<script>
const prices = {
  "100":"0.99",
  "210":"1.99",
  "310":"2.99",
  "520":"4.99",
  "1060":"9.99",
  "2180":"19.99",
  "5600":"49.99",
  "10000":"89.99",
  "20000":"169.99",
  "week":"1.99",
  "month":"7.99"
};

function showPrice() {
    let uid = document.getElementById("uid").value.trim();

    if(uid==""){
        alert("أدخل ID اللاعب");
        return;
    }

    let product = document.getElementById("product").value;

    let name = (product=="week")
      ? "العضوية الأسبوعية"
      : (product=="month")
      ? "العضوية الشهرية"
      : product + " 💎";

    let price = prices[product];

    document.getElementById("result").innerHTML =
    "<b>🆔 ID:</b> "+uid+
    "<br><b>📦 المنتج:</b> "+name+
    "<br><b>💰 السعر:</b> $"+price+
    "<br><br><button onclick='buyNow()'>🛒 شراء الآن</button>";
}

function buyNow() {
    let uid = document.getElementById("uid").value;
    let product = document.getElementById("product").value;

    let name = (product=="week")
      ? "العضوية الأسبوعية"
      : (product=="month")
      ? "العضوية الشهرية"
      : product + " 💎";

    let price = prices[product];

    let message =
    "مرحباً، أريد شراء " + name +
    "%0A🆔 ID: " + uid +
    "%0A💰 السعر: $" + price;

    window.location.href =
    "https://wa.me/963951421872?text=" + message;
}
</script>
</body>
</html>
