<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUXO SHOP</title>

<style>
body{
background:#111;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
}

header{
background:#ff6600;
padding:20px;
font-size:30px;
font-weight:bold;
}

.container{
max-width:500px;
margin:30px auto;
padding:20px;
background:#222;
border-radius:15px;
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#25D366;
color:#fff;
border:none;
border-radius:10px;
font-size:20px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:20px;
}
</style>
</head>

<body>

<header>FLUXO SHOP</header>

<div class="container">

<h2>شحن فري فاير</h2>

<input type="text" id="uid" placeholder="أدخل ID فري فاير">

<select id="diamonds">
<option value="100">100 💎</option>
<option value="310">310 💎</option>
<option value="520">520 💎</option>
<option value="1060">1060 💎</option>
<option value="2180">2180 💎</option>
</select>

<button onclick="checkPlayer()">تحقق</button>

<div class="result">
<p id="playerName"></p>
<p id="price"></p>
</div>

<a href="https://wa.me/963951421872">
<button style="margin-top:15px;">إرسال الطلب عبر واتساب</button>
</a>

</div>

<script>

const prices={
100:0.99,
310:2.99,
520:4.99,
1060:9.99,
2180:19.99
};

function checkPlayer(){

let uid=document.getElementById("uid").value;
let diamonds=document.getElementById("diamonds").value;

if(uid==""){
alert("أدخل ID أولاً");
return;
}

document.getElementById("playerName").innerHTML=
"ID اللاعب: "+uid;

document.getElementById("price").innerHTML=
"السعر: $"+prices[diamonds];

}

</script>
<div class="card">
  <h2>💳 العضوية الأسبوعية</h2>
  <p>100 💎 يوميًا لمدة 7 أيام</p>
  <h3>$1.99</h3>
  <a class="btn" href="https://wa.me/963951421872?text=أريد شراء العضوية الأسبوعية">شراء</a>
</div>

<div class="card">
  <h2>👑 العضوية الشهرية</h2>
  <p>60 💎 يوميًا لمدة 30 يومًا</p>
  <h3>$7.99</h3>
  <a class="btn" href="https://wa.me/963951421872?text=أريد شراء العضوية الشهرية">شراء</a>
</div>

<div class="card">
  <h2>⭐ العضوية الأسبوعية + الشهرية</h2>
  <p>عرض خاص</p>
  <h3>$9.49</h3>
  <a class="btn" href="https://wa.me/963951421872?text=أريد شراء العرض">شراء</a>
</div>
</body>
